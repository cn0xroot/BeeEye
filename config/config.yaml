# 蜂眼 BeeEye 运行配置 (program.md §3.4.5 / §3.11)
# 所有阈值均可调,不在代码中硬编码。

listen_addr: ":8080"
db_path: "./data/BeeEye.db"
web_dir: "./BeeEye-web/dist"

# 采集接口:名称不与具体网卡硬编码耦合 (F16)。
# mode: explicit = 只采集下方列出的接口;auto = 自动发现并按 exclude_patterns 排除 (F20)
interfaces:
  mode: explicit
  explicit_list:
    - name: wlan0
      role: wifi_ap        # 无线接入 → access_type=wireless (F17)
    - name: eth0
      role: wan_uplink
    # - name: wlx00c0ca9701f2   # USB 网卡等非标准命名同样支持
    #   role: wifi_ap
  auto_discover:
    exclude_patterns:
      - lo
      - "docker*"
      - "veth*"
      - "br-*"

# 检测引擎参数 (§3.11)
detection:
  beacon:
    min_samples: 6        # N_min:少于该样本数不做信标判定
    cv_threshold: 0.15    # 间隔变异系数阈值,越小越"规律"
    min_interval_s: 10    # 低于此间隔视为流式传输,不算信标
    max_interval_s: 3600  # 高于此间隔样本太稀疏,不判定
    window_min: 120       # 滑动窗口长度(分钟)
  risk_thresholds:        # 多信号加权评分分级 (§3.11.5)
    high: 50
    medium: 30
    low: 15
  auto_block: false       # F38 高危自动阻断,默认关闭,仅告警
  baseline:                # 设备行为基线建模 (F10),按设备+小时分桶学习历史流量分布
    min_days: 5             # 该小时桶下至少见过这么多天历史才做离群判定,避免冷启动误报
    z_threshold: 3.0        # 今天该小时流量与历史均值的标准差倍数,超过即判定离群
    min_stddev_kb: 8        # 标准差下限(KB),给流量近乎恒定的设备兜底,避免除零/过度敏感

# 威胁情报比对 (F29)。启用后拉取公开黑名单,与设备连接的目的 IP 比对,
# 命中即产出 threat_intel 信号。全程离线缓存到 cache_dir,拉取失败时
# 沿用上一次缓存,绝不阻塞抓包主流程。
threat_intel:
  enabled: false
  feeds:
    - spamhaus_drop       # Spamhaus DROP:被劫持/防弹主机网段,免注册
  refresh_hours: 24
  cache_dir: "./data/threatintel"

# 手机/电脑端可选 TLS 解密 (F45)。类 Surge/Burp/mitmproxy 的使用模型:
# 用户在自己的手机/电脑上主动装 BeeEye 生成的根证书、把该设备的 HTTPS
# 代理指向 listen 这个端口,才会被解密;没装证书的设备(门锁、摄像头等
# IoT 终端)连接会直接失败,不存在静默明文透传。默认开启只是让代理监听
# 并生成 CA,不解密任何设备的任何流量——解密只在某台设备主动装了这份
# CA、并把该设备自己的代理指向这个监听地址之后才开始,见 TLS-DECRYPT.md。
mitm:
  enabled: true
  listen: ":8443"          # CONNECT 代理监听地址
  ca_dir: "./data/mitm"    # 根证书 ca.pem/ca.key 的存放目录,首次启动自动生成
  max_log: 500              # 内存中保留的最近解密请求/响应条数,超出后淘汰最旧的

# 演示/开发模式:无 eBPF 内核时用内置模拟采集源生成场景数据。
# 固定 seed → 可复现的测试数据集。
simulate_seed: 42

# 知名端口 → 服务名映射 (F24, §3.5.4)。留空则用内置默认表。
port_service_map_file: "./config/port-service-map.yaml"
