<!doctype html>
<!--
  This is BeeEye-desktop's permanent window content, not a placeholder —
  lib.rs no longer navigates away from it. It hosts both existing web UIs
  (BeeEye-web on :8080, BeeEye-gui on :8081) in <iframe>s, switched by the
  tab bar below, so one desktop window covers both instead of two.
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>BeeEye</title>
<style>
  :root {
    --accent-top: #ffc83d;
    --accent-bot: #b45309;
    --bg: #111318;
    --panel: #181b22;
    --text: #eee;
    --dim: #9aa0ab;
    --border: #2a2e38;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body { display: flex; flex-direction: column; }
  .tabbar {
    display: flex; align-items: center; gap: 2px; padding: 6px 10px 0;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: none;
  }
  .tab {
    cursor: pointer; padding: 8px 16px; border-radius: 8px 8px 0 0;
    color: var(--dim); font-size: 13px; user-select: none; background: transparent;
  }
  .tab.active {
    color: #1a1206; font-weight: 600;
    background: linear-gradient(180deg, var(--accent-top), var(--accent-bot));
  }
  .tab:not(.active):hover { color: var(--text); background: #20242e; }
  .panes { position: relative; flex: 1; min-height: 0; }
  .pane { position: absolute; inset: 0; display: none; }
  .pane.active { display: block; }
  iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .status {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: var(--dim); font-size: 14px; background: var(--bg);
  }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border);
    border-top-color: var(--accent-top); animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .retry {
    margin-top: 4px; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer; font-size: 12px;
  }
  .retry:hover { background: #20242e; }
</style>
</head>
<body>
  <div class="tabbar">
    <div class="tab active" data-target="analyzer">📊 分析器 Analyzer</div>
    <div class="tab" data-target="overview">🐝 总览 Overview</div>
  </div>
  <div class="panes">
    <div class="pane active" id="pane-analyzer"></div>
    <div class="pane" id="pane-overview"></div>
  </div>
<script>
  const TARGETS = {
    overview: { url: 'http://127.0.0.1:8080', label: '总览 Overview', pane: document.getElementById('pane-overview') },
    analyzer: { url: 'http://127.0.0.1:8081', label: '分析器 Analyzer', pane: document.getElementById('pane-analyzer') },
  };
  const tabs = document.querySelectorAll('.tab');
  const loaded = {};

  function renderStatus(pane, text, showRetry, key) {
    pane.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'status';
    box.innerHTML = '<div class="spinner"></div><div>' + text + '</div>';
    if (showRetry) {
      const btn = document.createElement('button');
      btn.className = 'retry';
      btn.textContent = '重试 Retry';
      btn.onclick = () => probe(key, true);
      box.appendChild(btn);
    }
    pane.appendChild(box);
  }

  function loadIframe(pane, url) {
    pane.innerHTML = '';
    const f = document.createElement('iframe');
    f.src = url;
    pane.appendChild(f);
  }

  // Each backend is its own long-running process with its own startup
  // timing (the analyzer may still be mid-spawn); poll rather than assume
  // either is ready, and keep retrying quietly instead of a one-shot error.
  async function probe(key, force) {
    const t = TARGETS[key];
    if (loaded[key] && !force) return;
    renderStatus(t.pane, '正在连接 ' + t.label + ' · Connecting…', false);
    try {
      await fetch(t.url, { mode: 'no-cors', cache: 'no-store' });
      loaded[key] = true;
      loadIframe(t.pane, t.url);
    } catch (e) {
      renderStatus(t.pane, t.label + ' 尚未就绪 · not reachable yet', true, key);
      setTimeout(() => probe(key), 1500);
    }
  }

  tabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      const key = tab.dataset.target;
      tabs.forEach((x) => x.classList.toggle('active', x === tab));
      Object.entries(TARGETS).forEach(([k, t]) => t.pane.classList.toggle('active', k === key));
      probe(key);
    });
  });

  probe('analyzer');
</script>
</body>
</html>
