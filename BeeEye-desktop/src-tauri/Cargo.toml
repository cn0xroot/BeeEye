[package]
name = "BeeEye-desktop"
version = "0.1.0"
description = "Standalone desktop window for the BeeEye live analyzer — a thin Tauri shell around the existing BeeEye-gui web UI, no frontend code duplicated or rewritten."
edition = "2021"

[lib]
name = "BeeEye_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
